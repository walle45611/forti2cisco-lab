---
router_id: 2.2.2.2

interfaces:
  - name: Loopback0
    enabled: true

  - name: Ethernet0/1
    enabled: true

  - name: Ethernet0/2
    enabled: true

  - name: Ethernet0/3
    enabled: true

l3_interfaces:
  - name: Loopback0
    ipv4:
      - address: 2.2.2.2/32

  - name: Ethernet0/1
    ipv4:
      - address: 10.0.23.2/30

  - name: Ethernet0/2
    ipv4:
      - address: 10.10.10.1/24

  - name: Ethernet0/3
    ipv4:
      - address: 10.20.20.1/24

ospf_interfaces:
  - name: Loopback0
    address_family:
      - afi: ipv4
        process:
          id: 1
          area_id: "0"

  - name: Ethernet0/1
    address_family:
      - afi: ipv4
        process:
          id: 1
          area_id: "0"
        network:
          point_to_point: true

  - name: Ethernet0/2
    address_family:
      - afi: ipv4
        process:
          id: 1
          area_id: "0"

  - name: Ethernet0/3
    address_family:
      - afi: ipv4
        process:
          id: 1
          area_id: "0"

ospf_active_interfaces:
  - Ethernet0/1
