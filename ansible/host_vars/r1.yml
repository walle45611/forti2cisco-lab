---
router_id: 1.1.1.1

interfaces:
  - name: Loopback0
    enabled: true

  - name: Ethernet0/1
    enabled: true

  - name: Ethernet0/2
    enabled: true

l3_interfaces:
  - name: Loopback0
    ipv4:
      - address: 1.1.1.1/32

  - name: Ethernet0/1
    ipv4:
      - address: 10.0.12.2/30

  - name: Ethernet0/2
    ipv4:
      - address: 10.0.23.1/30

ospf_interfaces:
  - name: Loopback0
    address_family:
      - afi: ipv4
        process:
          id: 1
          area_id: "0"

  - name: Ethernet0/1
    address_family:
      - afi: ipv4
        process:
          id: 1
          area_id: "0"
        network:
          point_to_point: true

  - name: Ethernet0/2
    address_family:
      - afi: ipv4
        process:
          id: 1
          area_id: "0"
        network:
          point_to_point: true

ospf_active_interfaces:
  - Ethernet0/1
  - Ethernet0/2
