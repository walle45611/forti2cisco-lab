---
- name: Configure Cisco routers
  hosts: cisco
  gather_facts: false

  tasks:
    - name: Configure interfaces
      cisco.ios.ios_interfaces:
        config: "{{ interfaces }}"
        state: merged

    - name: Configure interface IP addresses
      cisco.ios.ios_l3_interfaces:
        config: "{{ l3_interfaces }}"
        state: merged

    - name: Configure interface OSPF
      cisco.ios.ios_ospf_interfaces:
        config: "{{ ospf_interfaces }}"
        state: merged

    - name: Configure OSPF process
      cisco.ios.ios_ospfv2:
        config:
          processes:
            - process_id: 1
              router_id: "{{ router_id }}"
              passive_interfaces:
                default: true
                interface:
                  set_interface: false
                  name: "{{ ospf_active_interfaces }}"
        state: merged

    - name: Save configuration
      cisco.ios.ios_config:
        save_when: modified
